[project]
name = "meridian"
version = "0.1.0"
description = "Meridian Home Comfort AI call center agent."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic==1.15.0",
    "fastapi==0.146.0",
    "jinja2==3.1.6",
    "langgraph==1.2.16",
    "numpy==2.5.4",
    "openai==3.35.1",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.170.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests", "discovery", "kb", "evals", "scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
