# Retrieval test set (D6, T5). Covers the handled call drivers (D3): scheduling and service questions
# around a booking (hours, holidays, area, windows, fees, late techs, prices, services offered,
# pre-visit troubleshooting), membership, billing, warranty.
# expected = KB source paths (as in kb/manifest.toml) that hold the answer.
# answer = verbatim phrases (any one) from the answering section; a hit = a top-3 section from an
#   expected doc that contains one. Phrases must state the answer, not just mention the topic.
#   Document-level hits are reported too.
# source: "transcript" = caller wording from a transcript (near-verbatim); "kb" = drafted by Claude
#   from the KB text (tends to share the docs' words, so easier); "paraphrase" = reworded kb questions.
# Separately, every query is checked: no superseded, stub or agent_only doc may ever be returned.

